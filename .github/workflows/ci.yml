name: Coconut Cross-Platform CI

on:
  push:
    branches: [ stable, dev ]
  pull_request:
    branches: [ stable, dev ]

jobs:
  desktop-build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
            generator: Ninja
          - name: Linux x64 (GCC)
            os: ubuntu-latest
            generator: Ninja
          - name: macOS arm64 (AppleClang)
            os: macos-latest
            generator: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libudev-dev libasound2-dev

      - name: Install macOS Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOCONUT_BUILD_TESTS=ON -DCOCONUT_BUILD_GUI=ON

      - name: Build Coconut & Tests
        run: cmake --build build --parallel

      - name: Run Unit & Integration Tests
        run: ctest --test-dir build --output-on-failure

  android-build:
    name: Build Android (NDK arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure Android NDK CMake (arm64-v8a)
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCOCONUT_BUILD_TESTS=OFF \
            -DCOCONUT_BUILD_GUI=ON
      - name: Build libcoconut.so (arm64-v8a)
        run: cmake --build build-android --parallel

  ripper-bridge:
    name: Build .NET Coconut.RipperBridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build RipperBridge
        run: dotnet build tools/Coconut.RipperBridge/Coconut.RipperBridge.csproj -c Release
