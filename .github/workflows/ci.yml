name: Coconut Cross-Platform CI

on:
  push:
    branches: [ stable, dev ]
  pull_request:
    branches: [ stable, dev ]

jobs:
  desktop-build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
            generator: Ninja
          - name: Linux x64 (GCC)
            os: ubuntu-latest
            generator: Ninja
          - name: macOS arm64 (AppleClang)
            os: macos-latest
            generator: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libudev-dev libasound2-dev

      - name: Install macOS Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOCONUT_BUILD_TESTS=ON -DCOCONUT_BUILD_GUI=ON

      - name: Build Coconut & Tests
        run: cmake --build build --parallel

      - name: Run Unit & Integration Tests
        run: ctest --test-dir build --output-on-failure

  internal-ripper-core:
    name: Build Internal AssetRipper Fork (Coconut.RipperCore, .NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Coconut.RipperCore
        run: dotnet build internal/Coconut.RipperCore/Coconut.RipperCore.csproj -c Release
      - name: Smoke Test Coconut.RipperCore CLI
        run: dotnet internal/Coconut.RipperCore/bin/Release/net10.0/Coconut.RipperCore.dll --version
