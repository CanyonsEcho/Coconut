plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.canyonsecho.coconut'
    compileSdk 35

    defaultConfig {
        applicationId "dev.canyonsecho.coconut"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCOCONUT_BUILD_TESTS=OFF", "-DCOCONUT_BUILD_GUI=ON"
                cppFlags "-std=c++20"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../../resources']
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
            version "3.24.0+"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
